services:
  db:
    image: postgres:15
    restart: unless-stopped
    command: postgres -c log_min_messages=WARNING -c log_min_duration_statement=-1
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - budgetis

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - budgetis

  media:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/media.conf:/etc/nginx/nginx.conf:ro
      - media_data:/usr/share/nginx/html/media
    expose:
      - "80"
    networks:
      - budgetis
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.media.rule=Host(`budgetis.genolier.ch`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.media.entrypoints=websecure"
      - "traefik.http.routers.media.tls.certresolver=letsencrypt"
      - "traefik.http.services.media.loadbalancer.server.port=80"

  web:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-tmp-dir /dev/shm
    entrypoint: [ "/app/docker/entrypoint.sh" ]
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # Router HTTPS
      - "traefik.http.routers.budgetis.rule=Host(`budgetis.genolier.ch`)"
      - "traefik.http.routers.budgetis.entrypoints=websecure"
      - "traefik.http.routers.budgetis.tls.certresolver=letsencrypt"
      - "traefik.http.routers.budgetis.service=budgetis"

      # Router HTTP -> HTTPS
      - "traefik.http.routers.budgetis_http.rule=Host(`budgetis.genolier.ch`)"
      - "traefik.http.routers.budgetis_http.entrypoints=web"
      - "traefik.http.routers.budgetis_http.middlewares=redirect-to-https"

      # Middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # Rate limiting global
      - "traefik.http.middlewares.global-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.global-ratelimit.ratelimit.burst=200"
      - "traefik.http.middlewares.global-ratelimit.ratelimit.period=1m"

      - "traefik.http.services.budgetis.loadbalancer.server.port=8000"

      # Rate limiting for login
      - "traefik.http.routers.login.rule=Host(`budgetis.genolier.ch`) && Path(`/admin/login/`)"
      - "traefik.http.routers.login.entrypoints=websecure"
      - "traefik.http.routers.login.middlewares=login-ratelimit@docker"
      - "traefik.http.routers.login.service=budgetis"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.burst=10"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.period=1m"

    networks:
      - budgetis
      - web
    volumes:
      - static_data:/app/static
      - media_data:/app/media

  celery:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    command: celery -A config.celery_app worker -l info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    networks:
      - budgetis
    volumes:
      - media_data:/app/media

  celery-beat:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    command: celery -A config.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    networks:
      - budgetis

volumes:
  postgres_data:
  letsencrypt:
  static_data:
  media_data:
    external: true
    name: budgetis_media_data

networks:
  budgetis:
    external: false
  web:
    external: true
