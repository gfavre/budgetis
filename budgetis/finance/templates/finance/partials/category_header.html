<span id="category-header-{{ category.pk }}"
      {% if oob %}hx-swap-oob="true"{% endif %}>
  <span class="d-inline-block me-2"
        style="width:1em;
               height:1em;
               background:{{ category.color }};
               border-radius:2px;
               vertical-align:middle"></span>
  <strong>{{ category.name }}</strong>
</span>
{% if oob %}
  {% include "finance/partials/category_nav_link.html" with category=category oob=True %}
{% endif %}
