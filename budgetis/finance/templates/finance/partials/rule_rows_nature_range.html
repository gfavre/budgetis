{% load i18n %}

<tbody id="rules-nature-range-{{ category.pk }}"
       {% if oob %}hx-swap-oob="true"{% endif %}>
  {% for rule in rules %}
    <tr>
      <td>{{ rule.nature_start }}</td>
      <td>{{ rule.nature_end }}</td>
      <td>{{ rule.priority }}</td>
      <td class="text-end">{% include "finance/partials/rule_actions.html" with rule_type="nature-range" %}</td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="4" class="text-muted fst-italic">{% trans "No rule for this scheme yet." %}</td>
    </tr>
  {% endfor %}
</tbody>
