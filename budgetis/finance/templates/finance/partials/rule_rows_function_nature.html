{% load i18n %}

<tbody id="rules-function-nature-{{ category.pk }}"
       {% if oob %}hx-swap-oob="true"{% endif %}>
  {% for rule in rules %}
    <tr>
      <td>{{ rule.function_prefix }}*</td>
      <td>{{ rule.nature_start }}</td>
      <td>{{ rule.nature_end }}</td>
      <td class="text-end">{% include "finance/partials/rule_actions.html" with rule_type="function-nature" %}</td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="4" class="text-muted fst-italic">{% trans "No rule for this scheme yet." %}</td>
    </tr>
  {% endfor %}
</tbody>
