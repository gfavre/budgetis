{% load i18n %}

<tbody id="rules-account-code-{{ category.pk }}"
       {% if oob %}hx-swap-oob="true"{% endif %}>
  {% for rule in rules %}
    <tr>
      <td>{{ rule.function }}</td>
      <td>{{ rule.nature }}</td>
      <td>{{ rule.sub_account|default:"—" }}</td>
      <td class="text-end">{% include "finance/partials/rule_actions.html" with rule_type="account-code" %}</td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="4" class="text-muted fst-italic">{% trans "No rule for this scheme yet." %}</td>
    </tr>
  {% endfor %}
</tbody>
