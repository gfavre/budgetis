{% load i18n %}

<tbody id="rules-label-{{ category.pk }}"
       {% if oob %}hx-swap-oob="true"{% endif %}>
  {% for rule in rules %}
    <tr>
      <td>{{ rule.pattern }}</td>
      <td class="text-end">{% include "finance/partials/rule_actions.html" with rule_type="label" %}</td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="2" class="text-muted fst-italic">{% trans "No rule for this scheme yet." %}</td>
    </tr>
  {% endfor %}
</tbody>
