{% extends "base.html" %}

{% load crispy_forms_tags i18n %}

{% block title %}
  {{ object }}
{% endblock title %}
{% block content %}
  <h1>
    <i class="bi bi-pencil me-2"></i>{% blocktrans with name=object %}Edit {{ name }}{% endblocktrans %}
  </h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-lg me-1"></i>{% trans "Save" %}
    </button>
    <a href="{% url 'users:management' %}" class="btn btn-link">{% trans "Cancel" %}</a>
  </form>
{% endblock content %}
