{% extends "base.html" %}

{% load crispy_forms_tags i18n %}

{% block title %}
  {{ object }}
{% endblock title %}
{% block content %}
  <h1>{% blocktrans with name=object %}Edit {{ name }}{% endblocktrans %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">{% trans "Save" %}</button>
    <a href="{% url 'users:management' %}" class="btn btn-link">{% trans "Cancel" %}</a>
  </form>
{% endblock content %}
