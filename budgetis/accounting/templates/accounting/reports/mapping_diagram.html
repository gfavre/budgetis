<svg class="migration-diagram"
     viewBox="0 0 1000 360"
     role="img"
     aria-labelledby="mapping-diagram-title mapping-diagram-description">
  <title id="mapping-diagram-title">Structure des correspondances MCH1 vers MCH2</title>
  <desc id="mapping-diagram-description">{{ report.split }} comptes ventilés au total et {{ report.merged }} fusionnés au total. Chacun de ces deux totaux inclut les {{ report.complex }} comptes complexes représentés dans l’intersection. {{ report.simple }} comptes sont transposés un à un. Les surfaces ne sont pas proportionnelles aux effectifs.</desc>
  <defs><clipPath id="mapping-split-circle"><ellipse cx="235" cy="210" rx="215" ry="115" /></clipPath></defs>
  <ellipse cx="235" cy="210" rx="215" ry="115" fill="var(--report-primary-light)" stroke="var(--report-primary-dark)" stroke-width="2" />
  <ellipse cx="475" cy="210" rx="215" ry="115" fill="var(--report-secondary-light)" stroke="var(--report-secondary-dark)" stroke-width="2" />
  <ellipse cx="475" cy="210" rx="215" ry="115" fill="var(--report-overlap)" clip-path="url(#mapping-split-circle)" />
  <g text-anchor="middle" font-family="Arial, sans-serif">
  <g fill="var(--report-primary-dark)">
  <text x="210" y="54" font-size="58" font-weight="bold">{{ report.split }}</text>
  <text x="210" y="85" font-size="23" font-weight="bold">Ventilés au total</text>
  <text x="160" y="185" font-size="26" font-weight="bold">Ventilation</text>
  <text x="160" y="217" font-size="18">1 MCH1 →</text>
  <text x="160" y="243" font-size="18">plusieurs MCH2</text>
  </g>
  <g fill="white">
  <text x="355" y="182" font-size="23" font-weight="bold">Complexes</text>
  <text x="355" y="209" font-size="16">Ventilés</text>
  <text x="355" y="232" font-size="16">et fusionnés</text>
  <text x="355" y="275" font-size="36" font-weight="bold">{{ report.complex }}</text>
  </g>
  <g fill="var(--report-secondary-dark)">
  <text x="535" y="54" font-size="58" font-weight="bold">{{ report.merged }}</text>
  <text x="535" y="85" font-size="23" font-weight="bold">Fusionnés au total</text>
  <text x="550" y="185" font-size="26" font-weight="bold">Fusion</text>
  <text x="550" y="217" font-size="18">Plusieurs MCH1 →</text>
  <text x="550" y="243" font-size="18">1 MCH2</text>
  </g>
  <path d="M720 10 V300" stroke="#9daaba" stroke-dasharray="4 4" />
  <g fill="var(--report-ink)">
  <text x="860" y="54" font-size="58" font-weight="bold">{{ report.simple }}</text>
  <text x="860" y="85" font-size="23" font-weight="bold">Transposés 1:1</text>
  <text x="860" y="185" font-size="17">1 origine, 1 destination</text>
  <text x="860" y="211" font-size="17">exclusive</text>
  {% if report.example %}<text x="860" y="285" font-size="14">{{ report.example.0 }} → {{ report.example.1 }}</text>{% endif %}
  </g>
  <text x="475" y="350" fill="#526172" font-size="16">{{ report.merged }} comptes MCH1 vers {{ report.merged_targets }} cibles MCH2 partagées.</text>
  </g>
</svg>
<p class="migration-method">Les {{ report.complex }} cas complexes sont inclus dans chacun des deux totaux. Les surfaces ne sont pas proportionnelles aux effectifs.</p>
