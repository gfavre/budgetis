{% load i18n %}

{% if is_paginated %}
  <nav aria-label="{% trans 'Pagination' %}">
    <ul class="pagination justify-content-center">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;year={{ request.GET.year|urlencode }}">{% trans "Previous" %}</a>
        </li>
      {% endif %}
      <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link"
             href="?page={{ page_obj.next_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;year={{ request.GET.year|urlencode }}">{% trans "Next" %}</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
