[project]
name = "budgetis"
version = "1.2.0"
description = "Gestion des comptes et du budget communal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery>=5.5.3",
    "crispy-bootstrap5>=2025.6",
    # Stay on the 5.2 LTS line (long-term support, ~3 years) rather than 6.x
    # (a regular release, ~16 months of support) - the right tradeoff for a
    # production app that isn't upgraded on a tight cadence.
    "django>=5.2.17,<5.3",
    "django-allauth[mfa]>=65.9.0",
    "django-anymail[postmark]>=13.0",
    "django-axes>=8.0.0",
    "django-celery-beat>=2.8.1",
    "django-compressor>=4.5.1",
    "django-crispy-forms>=2.4",
    "django-environ>=0.12.0",
    "django-model-utils>=5.0.0",
    "django-redis>=6.0.0",
    "hiredis>=3.2.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pillow>=11.2.1",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.1.1",
    "python-slugify>=8.0.4",
    "rcssmin==1.1.2",
    "redis>=6.2.0",
    "sentry-sdk>=2.31.0",
    "uvicorn-worker>=0.3.0",
    "uvicorn[standard]>=0.34.3",
    "whitenoise>=6.9.0",
]


# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["budgetis/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
profile = "django"
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = false
format_js = false  # ← désactive la casse des blocs JS contenant {{ }}
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H021,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
ignore_blocks = "style,script"


[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]
line-length = 119

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TC",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "PLC0415",  # Allow function-scope imports when necessary
  "COM812",
  "G004", # Use of f-strings in logging calls
  "ERA001", # commented-out code
  "TRY003", # Use of bare except
  "TID252", # import relative modules,
  "FBT002", # Boolean default positional argument in function definition
  "RUF002", # Docstring contains ambiguous `’` (RIGHT SINGLE QUOTATION MARK) => wtf!
]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder"
]
known-first-party = ["budgetis"]
known-local-folder = ["config", "tests"]
combine-as-imports = true
split-on-trailing-comma = true

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.9.1",
    # >=7.0 unconditionally imports django.contrib.gis's postgis adapter from
    # the SQL panel, which crashes at import time (OSError, not caught) on
    # any machine whose libgdal install doesn't match Python's architecture -
    # unrelated to this project, which doesn't use GeoDjango.
    "django-debug-toolbar>=5.2.0,<7.0",
    # mypy 2.x + django-stubs 6.x together get much stricter about the
    # factory_boy stub gap (DjangoModelFactory() resolving to the factory
    # class, not the model instance) - it goes from ~17 pre-existing errors
    # to 139, spread across nearly every test file. Fixing that for real
    # means adding cast() at every factory call site project-wide, which is
    # its own undertaking, not something to do as a side effect of a version
    # bump - so this stays on the 5.x/1.x lines until that's done deliberately.
    "django-stubs[compatible-mypy]>=5.2.1,<6.0",
    "ipdb>=0.13.13",
    "mypy>=1.16.1,<2.0",
    "watchfiles>=1.1.0",
    "werkzeug[watchdog]>=3.1.3",
    "djlint>=1.36.4",
    "factory-boy>=3.3.3",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-sugar>=1.0.0",
    "ruff>=0.12.0",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2024.10.3",
    "django-extensions>=4.1",
    "django-coverage-plugin>=3.1.1",
    "pytest-django>=4.11.1",
]
prod = [
    "gunicorn>=23.0.0",
    "sentry-sdk>=2.31.0",
]
